<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健康管理">
<meta name="theme-color" content="#0f0f0f">
<title>健康管理</title>
<style>
:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--bg4:#2e2e2e;--text:#f0f0f0;--text2:#999;--text3:#666;--accent:#7F77DD;--accent2:#1D9E75;--amber:#EF9F27;--blue:#378ADD;--red:#E24B4A;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--radius:16px;--radius-sm:10px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100dvh}
.topbar{padding:52px 20px 16px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.date-badge{font-size:13px;color:var(--text2);background:var(--bg3);padding:5px 10px;border-radius:20px}
.tab-bar{display:flex;background:var(--bg2);border-top:0.5px solid var(--border);padding-bottom:calc(8px + var(--safe-bottom));flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 6px;cursor:pointer;color:var(--text3);font-size:10px;border:none;background:transparent}
.tab-item.active{color:var(--accent)}
.tab-item svg{width:24px;height:24px;stroke-width:1.8}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.page{display:none}.page.active{display:block}
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.macro-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px}
.macro-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.macro-val{font-size:22px;font-weight:700}
.macro-target{font-size:12px;color:var(--text3);margin-top:2px}
.macro-bar{height:4px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
.macro-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.cal-ring-wrap{background:var(--bg2);border-radius:var(--radius);padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:20px}
.ring-labels{flex:1}
.ring-cal{font-size:32px;font-weight:700}
.ring-sub{font-size:13px;color:var(--text2);margin-top:2px}
.ring-remaining{font-size:13px;color:var(--text2);margin-top:8px}
.ring-remaining span{color:var(--text);font-weight:600}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.sec-title{font-size:17px;font-weight:600}
.meal-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.meal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-meta{font-size:12px;color:var(--text2);margin-top:2px}
.meal-kcal{font-size:15px;font-weight:600;flex-shrink:0}
.del-btn-small{background:transparent;border:none;color:var(--text3);cursor:pointer;padding:4px}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none}
.sheet-overlay.open{display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:480px;margin:0 auto;padding:12px 20px calc(20px + var(--safe-bottom));max-height:90dvh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;color:var(--text);appearance:none;-webkit-appearance:none}
.field input::placeholder{color:var(--text3)}
.field select option{background:var(--bg3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:15px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.btn-secondary{width:100%;background:var(--bg3);color:var(--text2);border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;cursor:pointer;margin-top:8px}
.hist-section{margin-bottom:12px}
.hist-label{font-size:12px;color:var(--text2);margin-bottom:8px}
.hist-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hist-scroll::-webkit-scrollbar{display:none}
.hist-chip{background:var(--bg3);border:0.5px solid var(--border2);border-radius:20px;padding:7px 14px;white-space:nowrap;font-size:13px;cursor:pointer;flex-shrink:0;color:var(--text)}
.hist-chip:active{background:var(--bg4)}
.body-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.body-card{background:var(--bg2);border-radius:var(--radius-sm);padding:16px;text-align:center}
.body-card-val{font-size:30px;font-weight:700;margin-bottom:2px}
.body-card-label{font-size:12px;color:var(--text2)}
.body-card-sub{font-size:12px;color:var(--text3);margin-top:4px}
.chart-card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.chart-card-title{font-size:14px;color:var(--text2);margin-bottom:12px}
.chart-wrap{position:relative;width:100%;height:160px}
.settings-section{background:var(--bg2);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.settings-row{display:flex;align-items:center;padding:14px 16px;border-bottom:0.5px solid var(--border);gap:12px}
.settings-row:last-child{border-bottom:none}
.settings-row-label{flex:1;font-size:15px}
.settings-row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.settings-row input{width:90px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--text);text-align:right}
.settings-section-title{font-size:12px;color:var(--text3);padding:16px 16px 6px;text-transform:uppercase;letter-spacing:0.5px}
.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:0.5px solid var(--border2);border-radius:20px;padding:10px 18px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dot-morning{background:#EF9F27}.dot-lunch{background:#378ADD}.dot-dinner{background:#7F77DD}.dot-snack{background:#1D9E75}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;line-height:1.8}
.empty-icon{font-size:36px;margin-bottom:8px}
.goal-banner{background:var(--bg2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.goal-banner-tag{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
.goal-banner-title{font-size:20px;font-weight:700;margin-bottom:4px}
.goal-banner-sub{font-size:13px;color:var(--text2)}
.goal-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.goal-result-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px}
.goal-result-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.goal-result-val{font-size:20px;font-weight:700}
.goal-result-unit{font-size:12px;font-weight:400;color:var(--text2);margin-left:2px}
.info-card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-label{font-size:13px;color:var(--text2)}
.info-val{font-size:14px;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:rgba(29,158,117,0.15);color:#1D9E75}
.badge-amber{background:rgba(239,159,39,0.15);color:#EF9F27}
.badge-red{background:rgba(226,75,74,0.15);color:#E24B4A}
.goal-empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;line-height:1.9}
.step-indicator{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--bg4)}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px}
.step-dot.done{background:var(--accent2)}
.goal-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.goal-type-card{background:var(--bg3);border:1.5px solid transparent;border-radius:var(--radius-sm);padding:16px;cursor:pointer;text-align:center}
.goal-type-card.selected{border-color:var(--accent)}
.goal-type-icon{font-size:28px;margin-bottom:8px}
.goal-type-label{font-size:14px;font-weight:600}
.goal-type-sub{font-size:11px;color:var(--text2);margin-top:4px}
/* DB検索 */
.db-search-wrap{position:relative;margin-bottom:10px}
.db-search-input{width:100%;background:var(--bg3);border:0.5px solid var(--accent);border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;color:var(--text)}
.db-search-input::placeholder{color:var(--text3)}
.db-results{background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);max-height:200px;overflow-y:auto;margin-bottom:10px}
.db-result-item{padding:11px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.db-result-item:last-child{border-bottom:none}
.db-result-item:active{background:var(--bg4)}
.db-result-name{font-size:14px;font-weight:500;color:var(--text)}
.db-result-meta{font-size:11px;color:var(--text2);margin-top:2px}
.db-result-cal{font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0}
.db-selected{background:rgba(29,158,117,0.1);border:0.5px solid var(--accent2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px}
.db-selected-name{font-size:14px;font-weight:600;color:var(--accent2);margin-bottom:6px}
.db-selected-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.db-selected-macro-val{font-size:16px;font-weight:700}
.db-selected-macro-label{font-size:10px;color:var(--text2);margin-top:1px}
.mode-tabs{display:flex;gap:6px;margin-bottom:14px}
.mode-tab{flex:1;padding:9px;font-size:12px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer}
.mode-tab.active{background:rgba(127,119,221,0.15);border-color:var(--accent);color:var(--accent);font-weight:600}
.db-no-result{padding:16px;text-align:center;color:var(--text3);font-size:13px}
.category-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.category-chips::-webkit-scrollbar{display:none}
.cat-chip{background:var(--bg3);border:0.5px solid var(--border2);border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:12px;cursor:pointer;flex-shrink:0;color:var(--text2)}
.cat-chip.active{background:rgba(127,119,221,0.15);border-color:var(--accent);color:var(--accent)}
/* ── カレンダー ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-month{font-size:18px;font-weight:700}
.cal-nav{background:transparent;border:0.5px solid var(--border2);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-day-label{text-align:center;font-size:11px;color:var(--text3);padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;gap:2px}
.cal-day:active{opacity:0.7}
.cal-day.empty{cursor:default}
.cal-day.today .cal-day-num{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal-day.selected{background:rgba(127,119,221,0.15);border:0.5px solid var(--accent)}
.cal-day-num{font-size:14px;font-weight:500;color:var(--text);width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal-day.other-month .cal-day-num{color:var(--text3)}
.cal-dot-row{display:flex;gap:2px;justify-content:center;height:6px}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-detail{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.cal-detail-date{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text)}
.cal-detail-section{margin-bottom:12px}
.cal-detail-section-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.cal-macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cal-macro-item{background:var(--bg3);border-radius:8px;padding:10px 6px;text-align:center}
.cal-macro-val{font-size:15px;font-weight:700}
.cal-macro-label{font-size:10px;color:var(--text2);margin-top:2px}
.cal-meal-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border)}
.cal-meal-item:last-child{border-bottom:none}
.cal-meal-name{font-size:13px;color:var(--text)}
.cal-meal-kcal{font-size:13px;font-weight:600;color:var(--accent)}
.cal-body-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal-body-item{background:var(--bg3);border-radius:8px;padding:10px;text-align:center}
.cal-body-val{font-size:20px;font-weight:700}
.cal-body-label{font-size:11px;color:var(--text2);margin-top:2px}
.cal-empty-day{text-align:center;padding:24px;color:var(--text3);font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title" id="pageTitle">食事</div>
  <div class="date-badge" id="dateBadge"></div>
</div>
<div class="content">
  <!-- 食事ページ -->
  <div class="page active" id="page-food">
    <div class="cal-ring-wrap">
      <div class="ring-labels">
        <div class="ring-cal"><span id="sumCal">0</span> <span style="font-size:16px;font-weight:400;color:var(--text2)">kcal</span></div>
        <div class="ring-sub">摂取カロリー</div>
        <div class="ring-remaining">目標まで <span id="calRemain">—</span> kcal</div>
      </div>
      <svg viewBox="0 0 80 80" width="80" height="80">
        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--bg4)" stroke-width="7"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" id="calRing" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset .5s"/>
      </svg>
    </div>
    <div class="macro-grid">
      <div class="macro-card"><div class="macro-label">タンパク質</div><div class="macro-val" style="color:var(--accent2)"><span id="sumP">0</span><span style="font-size:14px;font-weight:400">g</span></div><div class="macro-target">/ <span id="dispTgtP">—</span>g</div><div class="macro-bar"><div class="macro-bar-fill" id="barP" style="background:var(--accent2);width:0%"></div></div></div>
      <div class="macro-card"><div class="macro-label">脂質</div><div class="macro-val" style="color:var(--amber)"><span id="sumF">0</span><span style="font-size:14px;font-weight:400">g</span></div><div class="macro-target">/ <span id="dispTgtF">—</span>g</div><div class="macro-bar"><div class="macro-bar-fill" id="barF" style="background:var(--amber);width:0%"></div></div></div>
      <div class="macro-card"><div class="macro-label">炭水化物</div><div class="macro-val" style="color:var(--blue)"><span id="sumC">0</span><span style="font-size:14px;font-weight:400">g</span></div><div class="macro-target">/ <span id="dispTgtC">—</span>g</div><div class="macro-bar"><div class="macro-bar-fill" id="barC" style="background:var(--blue);width:0%"></div></div></div>
      <div class="macro-card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer" onclick="openSheet('meal')">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <div style="font-size:13px;color:var(--accent);margin-top:6px">食事を追加</div>
      </div>
    </div>
    <div class="sec-header"><div class="sec-title">今日の食事</div></div>
    <div id="mealList"></div>
  </div>

  <!-- 体重ページ -->
  <div class="page" id="page-body">
    <div class="body-summary">
      <div class="body-card"><div class="body-card-val" style="color:var(--accent)" id="latestWeight">—</div><div class="body-card-label">体重 kg</div><div class="body-card-sub" id="weightDiff"></div></div>
      <div class="body-card"><div class="body-card-val" style="color:var(--accent2)" id="latestFat">—</div><div class="body-card-label">体脂肪率 %</div><div class="body-card-sub" id="fatDiff"></div></div>
    </div>
    <div style="margin-bottom:16px"><button class="btn-primary" style="border-radius:var(--radius-sm)" onclick="openSheet('body')">+ 体重・体脂肪を記録</button></div>
    <div class="chart-card"><div class="chart-card-title">体重の推移 (kg)</div><div class="chart-wrap"><canvas id="weightChart"></canvas></div></div>
    <div class="chart-card"><div class="chart-card-title">体脂肪率の推移 (%)</div><div class="chart-wrap"><canvas id="fatChart"></canvas></div></div>
  </div>

  <!-- カレンダーページ -->
  <div class="page" id="page-calendar">
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrevMonth()">‹</button>
      <div class="cal-month" id="calMonthLabel"></div>
      <button class="cal-nav" onclick="calNextMonth()">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calDetail"></div>
  </div>

  <!-- 目標ページ -->
  <div class="page" id="page-goal"><div id="goalContent"></div></div>

  <!-- 設定ページ -->
  <div class="page" id="page-settings">
    <div class="settings-section-title">1日の目標（手動設定）</div>
    <div class="settings-section">
      <div class="settings-row" style="padding:10px 16px"><div class="settings-row-label" style="font-size:13px;color:var(--text2)">目標設定から自動計算された値が使われます。手動で上書きもできます。</div></div>
      <div class="settings-row"><div><div class="settings-row-label">カロリー</div></div><input type="number" id="stgCal" value="" min="0" placeholder="自動" onchange="saveManualTargets()"> <span style="font-size:13px;color:var(--text2)">kcal</span></div>
      <div class="settings-row"><div><div class="settings-row-label">タンパク質</div></div><input type="number" id="stgP" value="" min="0" placeholder="自動" onchange="saveManualTargets()"> <span style="font-size:13px;color:var(--text2)">g</span></div>
      <div class="settings-row"><div><div class="settings-row-label">脂質</div></div><input type="number" id="stgF" value="" min="0" placeholder="自動" onchange="saveManualTargets()"> <span style="font-size:13px;color:var(--text2)">g</span></div>
      <div class="settings-row"><div><div class="settings-row-label">炭水化物</div></div><input type="number" id="stgC" value="" min="0" placeholder="自動" onchange="saveManualTargets()"> <span style="font-size:13px;color:var(--text2)">g</span></div>
    </div>
    <div class="settings-section-title">データ</div>
    <div class="settings-section">

        const d=new Date(lastDate);
        if(!isNaN(d)){
          const oldDateStr=d.toISOString().split('T')[0];
          if(!allMealsLog[oldDateStr]||allMealsLog[oldDateStr].length===0)allMealsLog[oldDateStr]=oldMeals;
        }
      }
    }catch(e){}
    meals=[];
    localStorage.setItem('meals_today','[]');
    localStorage.setItem('last_date',todayDateStr);
    saveAllMealsLog();
  }else{
    try{meals=JSON.parse(localStorage.getItem('meals_today')||'[]');}catch(e){meals=[];}
    // 今日のログとも同期
    if(meals.length>0)allMealsLog[td]=meals;
  }
  try{foodHistory=JSON.parse(localStorage.getItem('food_history')||'[]');}catch(e){foodHistory=[];}
  try{bodyRecords=JSON.parse(localStorage.getItem('body_records')||'[]');}catch(e){bodyRecords=[];}
  try{const t=JSON.parse(localStorage.getItem('manual_targets')||'null');if(t)manualTargets=t;}catch(e){}
  try{goalData=JSON.parse(localStorage.getItem('goal_data')||'null');}catch(e){}
  if(goalData)goalResult=calcGoalTargets(goalData);
  applyTargets();
}

  localStorage.setItem('meals_today',JSON.stringify(meals));
  const td=todayStr();
  allMealsLog[td]=meals;
  saveAllMealsLog();
}

function renderCalendar(){

  if(!calSelectedDate)calSelectedDate=td;

function renderCalGrid(){
  const now=new Date();
  const td=todayStr();
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  const startDow=firstDay.getDay(); // 0=日
  const daysInMonth=lastDay.getDate();

  document.getElementById('calMonthLabel').textContent=`${calYear}年${calMonth+1}月`;

  const DAYS=['日','月','火','水','木','金','土'];
  let html=DAYS.map((d,i)=>`<div class="cal-day-label" style="${i===0?'color:#E24B4A':i===6?'color:#378ADD':''}">${d}</div>`).join('');

  // 空白
  for(let i=0;i<startDow;i++) html+=`<div class="cal-day empty"></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===td;
    const isSelected=dateStr===calSelectedDate;
    const dow=(startDow+d-1)%7;
    const dayMeals=allMealsLog[dateStr]||[];
    const bodyRec=bodyRecords.find(r=>r.date===dateStr);
    const hasMeals=dayMeals.length>0;
    const hasBody=!!bodyRec;

    let dotHtml='';
    if(hasMeals||hasBody){
      dotHtml='<div class="cal-dot-row">';
      if(hasMeals)dotHtml+=`<div class="cal-dot" style="background:var(--accent)"></div>`;
      if(hasBody)dotHtml+=`<div class="cal-dot" style="background:var(--accent2)"></div>`;
      dotHtml+='</div>';
    }

    html+=`<div class="cal-day${isToday?' today':''}${isSelected?' selected':''}" onclick="calSelectDate('${dateStr}')">
      <div class="cal-day-num" style="${dow===0?'color:var(--red)':dow===6?'color:var(--blue)':''}">${d}</div>
      ${dotHtml}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}

  calSelectedDate=dateStr;

}

// ── 目標計算 ──────────────────────────────────────────────
function calcGoalTargets(g){const{sex,age,height,weight,fat,targetWeight,targetFat,weeks,activityLevel}=g;const currentFatKg=weight*(fat/100),lbm=weight-currentFatKg;let bmr;if(sex==='male')bmr=88.362+13.397*weight+4.799*height-5.677*age;else bmr=447.593+9.247*weight+3.098*height-4.330*age;const actMult={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,veryActive:1.9};const tdee=Math.round(bmr*(actMult[activityLevel]||1.55));const tgtFatKg=(targetWeight||weight)*((targetFat||fat)/100);const fatToLose=Math.max(0,currentFatKg-tgtFatKg);const days=weeks*7;let dailyDeficit=days>0?Math.round(fatToLose*7700/days):0;dailyDeficit=Math.min(dailyDeficit,1000);let targetCal=Math.max(1200,tdee-dailyDeficit);const proteinG=Math.round(lbm*2.2),proteinCal=proteinG*4;const fatCal=Math.round(targetCal*0.25),fatG=Math.round(fatCal/9);const carbCal=Math.max(0,targetCal-proteinCal-fatCal),carbG=Math.round(carbCal/4);return{cal:Math.round(targetCal),p:proteinG,f:fatG,c:carbG,tdee,dailyDeficit:Math.round(dailyDeficit),fatToLose:Math.round(fatToLose*10)/10,lbm:Math.round(lbm*10)/10};}
const activityLabels={sedentary:'ほぼ運動なし',light:'週1〜2回',moderate:'週3〜4回',active:'週5〜6回',veryActive:'毎日激しく'};
function renderWizard(){const el=document.getElementById('goalWizard');const stepDots=['基本情報','目標設定','期間・活動量'].map((_,i)=>`<div class="step-dot ${i+1===wizardStep?'active':i+1<wizardStep?'done':''}"></div>`).join('');if(wizardStep===1){el.innerHTML=`<div class="step-indicator">${stepDots}</div><div class="sheet-title">基本情報を入力</div><div class="field-row"><div class="field"><label>性別</label><select id="wSex"><option value="male">男性</option><option value="female">女性</option></select></div><div class="field"><label>年齢</label><input type="number" id="wAge" placeholder="22" inputmode="numeric" value="${wizardState.age||''}"></div></div><div class="field-row"><div class="field"><label>身長 (cm)</label><input type="number" id="wHeight" placeholder="170" inputmode="decimal" value="${wizardState.height||''}"></div><div class="field"><label>体重 (kg)</label><input type="number" id="wWeight" placeholder="70.0" step="0.1" inputmode="decimal" value="${wizardState.weight||''}"></div></div><div class="field"><label>体脂肪率 (%)</label><input type="number" id="wFat" placeholder="20.0" step="0.1" inputmode="decimal" style="width:calc(50% - 5px)" value="${wizardState.fat||''}"></div><button class="btn-primary" onclick="wizardNext1()">次へ →</button><button class="btn-secondary" onclick="closeSheet('goal')">キャンセル</button>`;if(wizardState.sex)document.getElementById('wSex').value=wizardState.sex;}else if(wizardStep===2){el.innerHTML=`<div class="step-indicator">${stepDots}</div><div class="sheet-title">なりたい体型は？</div><div class="goal-type-grid"><div class="goal-type-card ${wizardState.goalType==='abs'?'selected':''}" onclick="selectGoalType('abs')"><div class="goal-type-icon">💪</div><div class="goal-type-label">腹筋を割る</div><div class="goal-type-sub">体脂肪率 10%以下</div></div><div class="goal-type-card ${wizardState.goalType==='lean'?'selected':''}" onclick="selectGoalType('lean')"><div class="goal-type-icon">✨</div><div class="goal-type-label">くびれを出す</div><div class="goal-type-sub">体脂肪率 18〜22%</div></div><div class="goal-type-card ${wizardState.goalType==='cut'?'selected':''}" onclick="selectGoalType('cut')"><div class="goal-type-icon">⚡</div><div class="goal-type-label">絞り込む</div><div class="goal-type-sub">体脂肪率を下げる</div></div><div class="goal-type-card ${wizardState.goalType==='custom'?'selected':''}" onclick="selectGoalType('custom')"><div class="goal-type-icon">🎯</div><div class="goal-type-label">数値で指定</div><div class="goal-type-sub">自分で設定</div></div></div><div id="customTargetFields" style="display:${wizardState.goalType==='custom'?'block':'none'};margin-top:12px"><div class="field-row"><div class="field"><label>目標体重 (kg)</label><input type="number" id="wTgtWeight" placeholder="${wizardState.weight||70}" step="0.1" inputmode="decimal" value="${wizardState.targetWeight||''}"></div><div class="field"><label>目標体脂肪率 (%)</label><input type="number" id="wTgtFat" placeholder="12" step="0.1" inputmode="decimal" value="${wizardState.targetFat||''}"></div></div></div><button class="btn-primary" onclick="wizardNext2()" style="margin-top:16px">次へ →</button><button class="btn-secondary" onclick="wizardBack()">← 戻る</button>`;}else if(wizardStep===3){el.innerHTML=`<div class="step-indicator">${stepDots}</div><div class="sheet-title">期間と活動量</div><div class="field"><label>目標達成まで（週）</label><select id="wWeeks">${[4,8,12,16,20,24,36,48].map(w=>`<option value="${w}" ${wizardState.weeks==w?'selected':''}>${w}週間（約${Math.round(w/4.3)}ヶ月）</option>`).join('')}</select></div><div class="field"><label>普段の活動量</label><select id="wActivity">${Object.entries(activityLabels).map(([k,v])=>`<option value="${k}" ${wizardState.activityLevel===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn-primary" onclick="wizardFinish()">計算する ✓</button><button class="btn-secondary" onclick="wizardBack()">← 戻る</button>`;}}
function selectGoalType(type){wizardState.goalType=type;document.querySelectorAll('.goal-type-card').forEach(c=>c.classList.remove('selected'));event.currentTarget.classList.add('selected');document.getElementById('customTargetFields').style.display=type==='custom'?'block':'none';}
function wizardNext1(){const age=parseInt(document.getElementById('wAge').value),height=parseFloat(document.getElementById('wHeight').value),weight=parseFloat(document.getElementById('wWeight').value),fat=parseFloat(document.getElementById('wFat').value),sex=document.getElementById('wSex').value;if(!age||!height||!weight||isNaN(fat)){showToast('すべての項目を入力してください');return;}wizardState={...wizardState,sex,age,height,weight,fat};wizardStep=2;renderWizard();}
function wizardNext2(){if(!wizardState.goalType){showToast('目標タイプを選んでください');return;}if(wizardState.goalType==='custom'){const tw=parseFloat(document.getElementById('wTgtWeight').value),tf=parseFloat(document.getElementById('wTgtFat').value);if(isNaN(tw)&&isNaN(tf)){showToast('目標値を入力してください');return;}wizardState.targetWeight=isNaN(tw)?wizardState.weight:tw;wizardState.targetFat=isNaN(tf)?null:tf;}else{const presets={abs:{fat:10,weight:wizardState.weight*(1-(wizardState.fat-10)/100)},lean:{fat:wizardState.sex==='female'?20:15,weight:null},cut:{fat:Math.max(8,wizardState.fat-5),weight:null}};const p=presets[wizardState.goalType];wizardState.targetFat=p.fat;wizardState.targetWeight=p.weight||wizardState.weight*(1-(wizardState.fat-p.fat)/100*0.8);}wizardStep=3;renderWizard();}
function wizardBack(){wizardStep--;renderWizard();}
function wizardFinish(){wizardState.weeks=parseInt(document.getElementById('wWeeks').value);wizardState.activityLevel=document.getElementById('wActivity').value;goalData={...wizardState};goalResult=calcGoalTargets(goalData);localStorage.setItem('goal_data',JSON.stringify(goalData));applyTargets();closeSheet('goal');renderGoalPage();showToast('目標を設定しました！');}
function renderGoalPage(){const el=document.getElementById('goalContent');if(!goalData||!goalResult){el.innerHTML=`<div class="goal-empty"><div style="font-size:48px;margin-bottom:12px">🎯</div><div style="font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px">目標を設定しよう</div>なりたい体型や目標体重を入力すると<br>1日に必要な摂取カロリーと<br>PFCバランスを自動で計算します<br><br><button class="btn-primary" style="width:auto;padding:14px 32px" onclick="openSheet('goal')">目標を設定する</button></div>`;return;}const g=goalData,r=goalResult;const goalTypeLabel={abs:'腹筋を割る',lean:'くびれを出す',cut:'絞り込む',custom:'数値で指定'}[g.goalType]||'目標';const ws=bodyRecords.filter(x=>x.weight!==null),fs=bodyRecords.filter(x=>x.fat!==null);const curW=ws.length?ws[ws.length-1].weight:g.weight,curF=fs.length?fs[fs.length-1].fat:g.fat;const startFatKg=g.weight*(g.fat/100),curFatKg=curW*(curF/100),tgtFatKg=g.targetWeight*(g.targetFat/100);const totalFatLoss=Math.max(0,startFatKg-tgtFatKg),doneFatLoss=Math.max(0,startFatKg-curFatKg);const progress=totalFatLoss>0?Math.min(100,Math.round(doneFatLoss/totalFatLoss*100)):0;const deficitBadge=r.dailyDeficit>600?'badge-red':r.dailyDeficit>300?'badge-amber':'badge-green';el.innerHTML=`<div class="goal-banner"><div class="goal-banner-tag">${goalTypeLabel}</div><div class="goal-banner-title">目標: 体脂肪率 ${g.targetFat}%</div><div class="goal-banner-sub">体重 ${g.targetWeight.toFixed(1)}kg まで</div><div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px"><span>進捗</span><span>${progress}%</span></div><div style="height:6px;background:var(--bg4);border-radius:3px;overflow:hidden"><div style="height:100%;background:var(--accent2);border-radius:3px;width:${progress}%;transition:width .5s"></div></div></div></div><div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:10px">1日の目標摂取量</div><div class="goal-result-grid"><div class="goal-result-card" style="grid-column:1/-1"><div class="goal-result-label">カロリー</div><div class="goal-result-val" style="font-size:32px;color:var(--accent)">${r.cal}<span class="goal-result-unit">kcal</span></div><div style="font-size:12px;color:var(--text2);margin-top:4px">TDEE ${r.tdee}kcal から <span class="badge ${deficitBadge}">${r.dailyDeficit}kcal 赤字</span></div></div><div class="goal-result-card"><div class="goal-result-label">タンパク質</div><div class="goal-result-val" style="color:var(--accent2)">${r.p}<span class="goal-result-unit">g</span></div></div><div class="goal-result-card"><div class="goal-result-label">脂質</div><div class="goal-result-val" style="color:var(--amber)">${r.f}<span class="goal-result-unit">g</span></div></div><div class="goal-result-card"><div class="goal-result-label">炭水化物</div><div class="goal-result-val" style="color:var(--blue)">${r.c}<span class="goal-result-unit">g</span></div></div></div><div class="info-card"><div class="info-row"><span class="info-label">現在の体脂肪</span><span class="info-val">${curFatKg.toFixed(1)} kg</span></div><div class="info-row"><span class="info-label">目標の体脂肪</span><span class="info-val">${tgtFatKg.toFixed(1)} kg</span></div><div class="info-row"><span class="info-label">落とす脂肪量</span><span class="info-val">${r.fatToLose} kg</span></div><div class="info-row"><span class="info-label">除脂肪体重 (LBM)</span><span class="info-val">${r.lbm} kg</span></div><div class="info-row"><span class="info-label">目標期間</span><span class="info-val">${g.weeks}週間</span></div><div class="info-row"><span class="info-label">活動量</span><span class="info-val">${activityLabels[g.activityLevel]||''}</span></div></div><button class="btn-secondary" onclick="openSheet('goal')" style="margin-bottom:20px">目標を変更する</button>`;if(!localStorage.getItem('goalStartDate'))localStorage.setItem('goalStartDate',todayStr());}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function clearToday(){if(!confirm('今日の食事記録を削除しますか？'))return;meals=[];saveMeals();renderMeals();updateSummary();showToast('削除しました');}
function clearAll(){if(!confirm('すべてのデータを削除しますか？この操作は元に戻せません。'))return;meals=[];foodHistory=[];bodyRecords=[];allMealsLog={};goalData=null;goalResult=null;localStorage.clear();renderMeals();updateSummary();updateBodyStats();renderGoalPage();showToast('削除しました');}

// ── 初期化 ────────────────────────────────────────────────
const now=new Date();
document.getElementById('dateBadge').textContent=`${now.getMonth()+1}/${now.getDate()}`;
load();renderMeals();updateSummary();updateBodyStats();
</script>
</body>
</html>
